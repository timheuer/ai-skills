name: "New Skill Proposal"
description: "Use this form to propose a new Skill with clear intent and scope."
title: "[Skill]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new Skill/Tool/Agent. Fill out the fields below.
        This helps maintainers understand the idea, scope, and impact.

  - type: input
    id: summary
    attributes:
      label: "1. One-Sentence Summary"
      description: "Describe the capability in one sentence."
      placeholder: "Example: Adds authentication scaffolding to ASP.NET projects."
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: "2. Problem Statement"
      description: |
        What problem does this solve?
        - Who is the user?
        - What are they trying to accomplish?
        - What pain does this remove?
      placeholder: "Describe the user problem."
    validations:
      required: true

  - type: textarea
    id: trigger_context
    attributes:
      label: "3. Trigger Context"
      description: |
        When should this Skill/Tool activate?
        Provide example prompts or signals that should trigger it.
      placeholder: "Example: 'Add auth', ASP.NET project detected"
    validations:
      required: true

  - type: input
    id: proposed_name
    attributes:
      label: "4. Proposed Name"
      description: "Suggested canonical name. Keep it discoverable and scoped."
      placeholder: "Example: auth-scaffold-aspnet"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "5. Alternatives Considered"
      description: "Why should this not be handled by existing Skill/Tool/Docs?"
      placeholder: "List alternatives and tradeoffs."
